# AN EDGE FROM AN INVOICE TO A CASE, that exists in no system. An unpaid invoice is tied to an
# open support case on the same account when the case was raised BEFORE the invoice fell due
# and is still open: the customer had a problem with us before we asked them for this money,
# and still has it.
#
# It does NOT say they are withholding payment. It says collections should not call this
# customer without knowing, and that the person best placed to get the invoice paid may be an
# engineer. `POSSIBLY_` is in the name on purpose; a surface that wants the stronger claim reads
# the case's thread (HealthCaseTriage) for whether the customer said so.
#
# Without the date test this would be a path ("same account") and the spec is right that a path
# needs no rule. The conclusion is the ORDER of two events in two different systems.

name: account-health/possibly-withheld-over
derives: POSSIBLY_WITHHELD_OVER
description: >-
  An unpaid invoice and a still-open support case on the same account, where the case was opened
  before the invoice's due date. `owed` is what the invoice still owes; `openedOn` when the case
  was raised. Concluded across billing and the helpdesk; computed when asked, never stored.
properties:
  owed:     { type: number, description: "What the invoice still owes, in major units of its currency." }
  openedOn: { type: string, description: "The day the case was raised." }
maxPairs: 20000
# BOOK SWEEPS, THEN RIDE THE SPINE — the same door inversion the fact views in ../views were
# built on, and the engine's answer to embabel/me#1489. Written as `(a:CustomerAccount)-[:HAS_CASE]->(c)`
# alone, a demand fetches once PER ACCOUNT, which is refused above `maxAnchors` (200): at 2,030
# accounts every demand failed, the bodies matched nothing, and the view answered "none". Each
# demand below first sweeps ONE door on the book (the desk, the billing books, the CRM book) and
# then names the vocabulary edge from the account to the SAME alias; that edge is declared
# `ridesHub: true` in its realm, so the engine links each account to its records by the spine's
# own key instead of fetching, and the bodies traverse the edges they always did. The desk sweep
# is `all` because the rules count `pending` cases as open, and every demand PROJECTS what it
# sweeps: a demand that only asks whether something exists is fetched as an existence check —
# one page — and the bodies then see 25 of 688 cases.
requires:
  - materialize: "MATCH (d:ChatwootDesk {status:'all'})-[:HAS_CASE]->(c:SupportCase) MATCH (a:CustomerAccount)-[:HAS_CASE]->(c) RETURN c.id AS id"
    description: "Every case on the desk, linked to its account by the account's domain."
  - materialize: "MATCH (b:LagoBooks {scope:'all'})-[:HAS_CUSTOMER]->(lc:BillingCustomer) MATCH (a:CustomerAccount)-[:BILLED_AS]->(lc) RETURN lc.id AS id"
    description: "Every billing customer, linked to its account by the customer's url."
  - materialize: "MATCH (b:LagoBooks {scope:'all'})-[:HAS_CUSTOMER]->(lc:BillingCustomer) MATCH (b)-[:HAS_INVOICE]->(i:BillingInvoice) MATCH (lc)-[:HAS_INVOICE]->(i) RETURN i.id AS id"
    description: "Every invoice on the books, linked to its billing customer."
rules:
  - derive: "(i)-[:POSSIBLY_WITHHELD_OVER {owed: owed, openedOn: openedOn}]->(c)"
    from: |
      MATCH (a:CustomerAccount)-[:BILLED_AS]->(:BillingCustomer)-[:HAS_INVOICE]->(i:BillingInvoice)
      WHERE i.paymentStatus <> 'succeeded' AND i.dueOn IS NOT NULL
      MATCH (a)-[:HAS_CASE]->(c:SupportCase)
      WHERE c.status IN ['open', 'pending'] AND c.openedOn IS NOT NULL AND c.openedOn <= i.dueOn
      WITH i, c, i.amountDueCents / 100.0 AS owed, c.openedOn AS openedOn
