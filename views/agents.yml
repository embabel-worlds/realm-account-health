# WHAT THE TWO COLLEAGUES WATCH. Each view here is the `holds:` of a duty in agents/, and its
# rows are the duty's VIOLATIONS: an empty answer is the duty kept. That is the whole contract a
# duty has with its view, so each one is written to be read that way — no row for anything that
# is fine, one row per thing somebody should act on, and enough on the row to act without
# asking again.
#
# They name no product, and sweep each system by its bare vocabulary label before joining through
# the spine, like the views in health.yml and for the same reason: a walk out from each account
# refuses above ~200 accounts. That includes a CRM account reached from a follow-up or a meeting:
# `TRACKED_AS` rides only a CRM the query has swept whole, so `MATCH (k:CrmAccount)` comes first
# even where the follow-up already names the company. Without it, 5,000 accounts asked the CRM
# about every one of them and the duty refused.
#
# A SET, THEN A NEGATION. "No follow-up exists" is the shape of most of these, and an OPTIONAL
# MATCH across a sweep is the one form health.yml records as unreliable. So the things that DO
# exist are collected into a list first — one row however many there are, an empty list when
# there are none — and the accounts are then matched with `NOT ... IN` that list.

- name: StewardUnacknowledgedRisk
  description: >-
    Accounts at risk that nobody has picked up: no follow-up is scheduled on the company in the
    CRM. One row per account, with every reason it is at risk. THE answer for "which at-risk
    accounts has nobody acknowledged" and the violations of Steward's first duty. An at-risk
    account the CRM has never heard of is always here: it cannot be followed up where it is not.
  # Acknowledged means a FOLLOW-UP, not a note. A note says somebody knew; a scheduled activity
  # says somebody will do something by a date, which is what "picked up" means to the account's
  # owner — and it is what Steward's repair proposes, so the duty and its repair agree.
  cypher: |
    MATCH (k:CrmAccount)
    MATCH (f:FollowUp)-[:FOLLOW_UP_ON]->(k)
    MATCH (fa:CustomerAccount)-[:TRACKED_AS]->(k)
    WITH collect(DISTINCT fa.accountKey) AS acknowledged
    MATCH (a:AtRiskAccount)
    WHERE NOT a.accountKey IN acknowledged
    RETURN a.accountKey AS accountKey, a.name AS account,
           a.riskFailedPayments AS failedPayments, a.riskOwingAndWaiting AS owingWhileCaseOpen,
           a.riskSellingIntoTrouble AS pipelineIntoTrouble, a.riskHighPriorityCases AS highPriorityCases,
           a.riskLongestThread AS longestThread, a.riskRenewsOn AS renewsOn,
           a.riskUnownedBilling AS unknownToCrm
    ORDER BY account

- name: StewardRenewalsWithoutCall
  description: >-
    At-risk accounts that renew within 60 days and have no call booked with them between now and
    the renewal. One row per account, with its renewal date. THE answer for "which risky renewals
    have no call booked" and the violations of Steward's second duty.
  # The renewal is the one at-risk carries: a renewal inside the rule's window while a case is
  # open. A meeting counts when the COMPANY is an attendee; one booked with only a person at the
  # company is not seen here, because MEETING_WITH reaches a person's own record, which TRACKED_AS
  # does not key an account by.
  cypher: |
    MATCH (m:Meeting)
    WHERE m.startsOn >= toString(date())
    MATCH (k:CrmAccount)
    MATCH (m)-[:MEETING_WITH]->(k)
    MATCH (ma:CustomerAccount)-[:TRACKED_AS]->(k)
    WITH collect(DISTINCT ma.accountKey) AS booked
    MATCH (a:AtRiskAccount)
    WHERE a.riskRenewsOn IS NOT NULL
      AND substring(a.riskRenewsOn, 0, 10) <= toString(date() + duration('P60D'))
      AND NOT a.accountKey IN booked
    RETURN a.accountKey AS accountKey, a.name AS account, substring(a.riskRenewsOn, 0, 10) AS renewsOn
    ORDER BY renewsOn

- name: ChaserUnchasedOverdue
  description: >-
    Invoices more than 14 days past due, unpaid, on an account nobody is chasing: no follow-up is
    scheduled on the company in the CRM. One row per invoice, most owed first. THE answer for
    "which overdue invoices is nobody chasing" and the violations of Chaser's first duty.
  # Overdue by BILLING's own due date. On a book loaded into a billing system that cannot backdate
  # an invoice (Lago cannot), that date is the load date plus the payment terms, so a freshly loaded
  # book has nothing 14 days overdue yet, and this view says so by answering empty.
  cypher: |
    MATCH (k:CrmAccount)
    MATCH (f:FollowUp)-[:FOLLOW_UP_ON]->(k)
    MATCH (fa:CustomerAccount)-[:TRACKED_AS]->(k)
    WITH collect(DISTINCT fa.accountKey) AS chased
    MATCH (i:BillingInvoice)
    WHERE i.paymentStatus <> 'succeeded' AND i.dueOn IS NOT NULL
      AND i.dueOn < toString(date() - duration('P14D'))
    MATCH (bc:BillingCustomer)
    MATCH (a:CustomerAccount)-[:BILLED_AS]->(bc)-[:HAS_INVOICE]->(i)
    WHERE NOT a.accountKey IN chased
    RETURN a.accountKey AS accountKey, a.name AS account, i.number AS invoice, i.dueOn AS dueOn,
           i.amount - i.amountPaid AS owed, i.currency AS currency, i.paymentStatus AS paymentStatus,
           i.sourceUrl AS invoiceUrl
    ORDER BY owed DESC

- name: ChaserWonWithoutSubscription
  description: >-
    Accounts with a deal won in the CRM and no active subscription in billing: sold, and not
    being billed. One row per account, with the won deals by name. THE answer for "which won
    deals are not billing" and the violations of Chaser's second duty.
  cypher: |
    MATCH (s:BillingSubscription)
    WHERE s.status = 'active'
    MATCH (bc:BillingCustomer)
    MATCH (sa:CustomerAccount)-[:BILLED_AS]->(bc)-[:HAS_SUBSCRIPTION]->(s)
    WITH collect(DISTINCT sa.accountKey) AS billing
    MATCH (o:Opportunity)
    WHERE o.status = 'won'
    MATCH (k:CrmAccount)
    MATCH (a:CustomerAccount)-[:TRACKED_AS]->(k)-[:HAS_OPPORTUNITY]->(o)
    WHERE NOT a.accountKey IN billing
    RETURN a.accountKey AS accountKey, a.name AS account, collect(o.title) AS wonDeals,
           sum(o.amount) AS wonValue
    ORDER BY wonValue DESC

- name: ChaserFailedPayments
  description: >-
    Every invoice billing tried to collect and could not, with its account. One row per invoice.
    THE answer for "which payments failed". Watch this view to fire Chaser's routine when a
    payment newly fails.
  # The routine's trigger, not a duty: a failed payment is an EVENT to react to the day it
  # happens, where an unchased overdue invoice is a CONDITION to keep false. A watch on this view
  # turns a new row into `view.ChaserFailedPayments.changed`, which the routine listens for.
  cypher: |
    MATCH (i:BillingInvoice)
    WHERE i.paymentStatus = 'failed'
    MATCH (bc:BillingCustomer)
    MATCH (a:CustomerAccount)-[:BILLED_AS]->(bc)-[:HAS_INVOICE]->(i)
    RETURN a.accountKey AS accountKey, a.name AS account, i.number AS invoice,
           i.amount - i.amountPaid AS owed, i.currency AS currency, i.sourceUrl AS invoiceUrl
    ORDER BY account, invoice
