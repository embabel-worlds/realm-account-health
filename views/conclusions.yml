# VIEWS PROJECT. Referencing a derived label is what makes its rules run, so each rule set ships
# the small view that carries its conclusion to every surface — the app, an agent over MCP, the
# SQL door, a question in words — with no client work.

- name: HealthAtRiskAccounts
  description: >-
    Which accounts are at risk, and every reason why. The accounts that are AT RISK, and every
    reason why, one column per reason (null when it does not apply): unpaidWhileWaiting (unpaid
    invoices while a case is open), openDealsWhileWaiting (open deals while a case is open),
    failedPayments, renewsOn (a renewal inside 120 days with a case open), longestThread (15+
    replies on an open case), highPriorityCases (urgent or high) and billedButUnknownToCrm. Most
    reasons first. THE answer for "which accounts are at risk", "which customers are in trouble",
    "why is <customer> at risk" and "who needs attention". The reasons are counts and dates, never
    money: for amounts, per currency, read HealthReceivablesByAccount and HealthPipelineByAccount.
  outputLabel: AtRiskAccountRow
  params:
    account:
      type: string
      default: ""
      description: "Only this account, by its domain exactly as accountKey holds it ('acme.com'). Empty = every account at risk. It filters the conclusion, which is still reached over the whole book: for one account's facts alone, the …ForAccount views are cheaper."
  # The ORDER is the number of reasons that hold, not money: the reasons it could have added are in
  # different units and, for money, different currencies.
  cypher: |
    MATCH (a:AtRiskAccount)
    WITH a, a.accountKey AS key
    WHERE $account = '' OR key = $account
    RETURN a.accountKey AS accountKey, a.name AS account,
           a.riskUnpaidWhileWaiting AS unpaidWhileWaiting, a.riskOpenDealsWhileWaiting AS openDealsWhileWaiting,
           a.riskFailedPayments AS failedPayments, a.riskRenewsOn AS renewsOn,
           a.riskLongestThread AS longestThread, a.riskHighPriorityCases AS highPriorityCases,
           a.riskBilledUnknownToCrm AS billedButUnknownToCrm,
           size([x IN [a.riskUnpaidWhileWaiting, a.riskOpenDealsWhileWaiting, a.riskFailedPayments,
                       a.riskRenewsOn, a.riskLongestThread, a.riskHighPriorityCases,
                       a.riskBilledUnknownToCrm] WHERE x IS NOT NULL]) AS reasons
    ORDER BY reasons DESC, account

# AREA FIRST. This view used to list every PAIR of accounts sharing an area, read off the derived
# SHARES_ISSUE edge. Pairs grow with the square of the accounts in an area: the scale book has eight
# areas and a case on one account in three, so 2,000 accounts made ~27,000 pairs against the rule
# set's `maxPairs` of 5,000, and 5,000 accounts ~170,000 — past the engine's 50,000-fact budget too.
# A relationship set past either is refused whole, never truncated, so the view failed by name. The question it answers — "one unhappy customer, or an incident?" — is about an AREA anyway,
# and grouped by area it is one sweep of the desk and one row per area. Which accounts share ONE
# account's areas is HealthSharedIssuesForAccount, which anchors the rule set on that account.
- name: HealthSharedIssues
  description: >-
    Product areas where two or more accounts have an open case. Each row: the area (the helpdesk's own area-* tag), accounts affected,
    openCases in it, and accountKeys, the domains of every account affected. Most accounts first.
    THE answer for "is this one unhappy customer or an incident", "which customers have the same
    problem" and "what else is affected by <area>". For the accounts sharing ONE account's areas,
    HealthSharedIssuesForAccount.
  outputLabel: SharedIssueAreaRow
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'open'
    UNWIND c.tags AS area
    WITH c, area, c.accountKey AS domain
    WHERE area STARTS WITH 'area-'
    MATCH (a:CustomerAccount {accountKey: domain})
    WITH area, count(DISTINCT a) AS accounts, count(c) AS openCases, collect(DISTINCT a.accountKey) AS accountKeys
    WHERE accounts >= 2
    RETURN area, accounts, openCases, accountKeys
    ORDER BY accounts DESC, area

- name: HealthSharedIssuesForAccount
  description: >-
    Other accounts with an open case in one account's product areas. For each: otherKey, otherAccount, shared (areas in common)
    and areas, most in common first. THE answer for "does anyone else have <customer>'s problem".
    Only open cases and only the helpdesk's area-* tags count; the account itself is not listed.
    `accountKey` is the domain, exactly ('acme.com').
  params:
    accountKey:
      type: string
      required: true
      description: "Required. The account's domain, exactly as accountKey holds it: lower case, no scheme or www ('acme.com')."
  outputLabel: AccountSharedIssueRow
  # A DIRECT QUERY, NOT THE RULE. It read SHARES_ISSUE, with the account passed to the rule set as a
  # param of the same name, and failed TOO_EXPENSIVE live: a view's arguments are substituted into
  # its Cypher as literals, so a rule set the view reads never receives them and concludes every pair
  # on the book (embabel/me#4177). One account's sharers need no pairs: the areas of the open cases,
  # each with the domains in it, kept where this account is one of them — one desk sweep, one row
  # per area before the regrouping by the other account.
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'open'
    UNWIND c.tags AS area
    WITH c.accountKey AS domain, area
    WHERE area STARTS WITH 'area-'
    WITH area, collect(DISTINCT domain) AS domains
    WHERE $accountKey IN domains
    UNWIND domains AS other
    WITH other, area
    WHERE other <> $accountKey
    WITH other, collect(area) AS areas
    MATCH (b:CustomerAccount {accountKey: other})
    RETURN $accountKey AS accountKey, b.accountKey AS otherKey, b.name AS otherAccount,
           size(areas) AS shared, areas
    ORDER BY shared DESC, otherAccount

- name: HealthPossiblyWithheld
  description: >-
    Unpaid invoices on accounts whose open case predates the due date. Unpaid invoices on accounts
    that raised a still-open support case BEFORE the invoice fell due — money collections should not
    chase without knowing about the problem. One row per invoice and case; owed is in major units of
    `currency`. THE answer for "are any customers withholding payment over a problem" and "which
    unpaid invoices are tied to a support case". It shows the two facts and their order; it does not
    claim the customer said so.
  outputLabel: PossiblyWithheldRow
  cypher: |
    MATCH (i:BillingInvoice)-[w:POSSIBLY_WITHHELD_OVER]->(c:SupportCase)
    MATCH (a:CustomerAccount {accountKey: c.accountKey})
    RETURN c.accountKey AS accountKey, a.name AS customer, i.number AS invoice, w.owed AS owed, i.currency AS currency,
           i.dueOn AS dueOn, c.subject AS caseSubject, w.openedOn AS caseOpenedOn,
           c.id AS caseId, i.sourceUrl AS invoiceUrl
    ORDER BY owed DESC
