# MODELS JUDGE. Two views where the answer is a reading of WORDS, which no query can give:
# how much a problem is hurting the customer, and whether sales knows about it at all. Every
# other cell in these rows is computed; the labels are the only model-made ones, and each
# rubric is written out here because this file is where a reader checks what a label means.
#
# Both are MATERIALISED. A judgement is model work — batched twenty rows to a call, so the triage
# at 150 cases is ~16 calls and ~10s cold (measured 2026-09-22) — and does not change until the
# words do, so the rows are kept for the `ttl` and an app reads them instantly. "Now" for these
# two views means "as of the last time they ran". The labels are repeatable: the judge runs at
# temperature 0, so a refresh over unchanged words yields the same labels.
#
# A model can be wrong, and these were checked against the sources by hand. The awareness
# judge called Rekall unaware although its CRM notes say "Custom reporting needs" and its case
# asks for a report builder; a literal word test got that one right and got others wrong. So a
# surface should treat a customer as a blind spot only where BOTH tests agree — the Account
# Signals app does — and should always show the notes themselves.

- name: HealthCaseTriage
  description: >-
    Every open support case, judged from the customer's own words: IMPACT on their business
    (blocked, degraded, inconvenienced, or merely asking for something) and their MOOD toward us
    (frustrated, neutral, positive). THE answer for "which customers are really hurting", "which
    support cases are serious", "who is frustrated with us" and "which open cases matter" — a
    42-reply thread about dark mode is not trouble, and a 7-reply thread from a blocked customer
    is. Cases with no message from the customer are absent: there is nothing to judge.
  # No outputLabel, deliberately: on a MATERIALISED view an outputLabel means "cache member
  # nodes", and a tabular body under it caches nothing and answers EMPTY. Without one the rows
  # themselves are snapshotted, which is what a table of judgements is.
  materialized: true
  ttl: 6h
  # DESK SWEEP, THEN A BOUNDED JUDGEMENT. Two separate limits are at work and both bit here.
  #
  # 1. `(a:CustomerAccount)-[:HAS_CASE]->` binds every account as an anchor — the same defect
  #    the fact views were inverted out of. At 510 accounts it refused outright.
  # 2. The message hop is per-conversation and CANNOT be swept: Chatwoot's API has no bulk
  #    message endpoint, only `/conversations/{id}/messages`. So each case judged is one
  #    fetch AND one model call, and 667 open cases is 667 of each — over `maxAnchors`, and
  #    an expensive refresh even where it runs.
  #
  # So the cases are taken off the desk in one read, ranked by how much back-and-forth they
  # have had, and only the worst 150 are fetched and judged. That ordering is the point: a case
  # nobody has replied to twice is not what "which customers are really hurting" is asking about.
  #
  # WHY A CAP AT ALL, and what the cold read costs. Each judged case is one desk fetch; the two
  # judgements (impact and mood) are batched twenty rows to a model call, so 150 cases is ~16
  # calls and ~10s cold — measured 2026-09-22, half of it the 150 per-conversation fetches. Before
  # batching it was ~300 serial calls and about three minutes, past a typical client timeout,
  # which is where the earlier cap of 20 came from. The cap that remains is the FETCH: the message
  # hop cannot be swept, and it rides a virtual join with a 200-anchor ceiling.
  #
  # Do NOT tune this by editing and re-reading: a materialised view's cache is keyed PER USER,
  # not per argument tuple, so a changed `LIMIT` serves the previous build until the `ttl`
  # expires. A lowered cap here returned the old 150-row result and looked like a success.
  #
  # The limit is a LITERAL, not a param: a materialized view may not declare params, because its
  # cache is keyed per user and not per argument tuple — the loader refuses one that does. Change
  # the number here and the next refresh picks it up.
  cypher: |
    MATCH (d:ChatwootDesk {status:'open'})-[:HAS_CASE]->(c:ChatwootConversation)
    WITH c, c.accountKey AS domain
    ORDER BY c.replyCount DESC
    LIMIT 150
    MATCH (a:CustomerAccount {accountKey: domain})
    WITH a, c
    MATCH (c)-[:HAS_MESSAGE]->(m:SupportMessage)
    WHERE m.messageType = 0
    WITH a, c, collect(m.body)[0] AS said
    RETURN a.accountKey AS accountKey, a.name AS account, c.id AS caseId, c.subject AS subject,
           c.priority AS priority, c.replyCount AS replies, c.openedOn AS openedOn,
           classify(said, 'blocked,degraded,inconvenienced,asking',
             'Each item is what one business customer wrote when raising a support case about a software product. Judge how much the problem hurts THEIR business right now. blocked: something they rely on does not work and they have no workaround. degraded: it works badly or intermittently, or a workaround is costing them. inconvenienced: a nuisance or cosmetic fault. asking: a question, or a request for something that does not exist yet.') AS impact,
           classify(said, 'frustrated,neutral,positive',
             'Each item is what one business customer wrote when raising a support case. Judge the tone of the writer toward the vendor from the words actually used, not from how serious the problem is.') AS mood
    ORDER BY replies DESC

- name: HealthCrmAwareness
  description: >-
    For every account with an open support case that the CRM tracks: does ANYTHING sales has
    written — on the company, its deals or its people — touch the topic of what support is
    dealing with? `aware` or `unaware`, judged by a model from the notes and the case subjects.
    THE answer for "does sales know about this customer's problem", "which open cases are not
    reflected in the CRM" and "where is sales blind". One opinion: check it against the notes.
  # No outputLabel, deliberately: on a MATERIALISED view an outputLabel means "cache member
  # nodes", and a tabular body under it caches nothing and answers EMPTY. Without one the rows
  # themselves are snapshotted, which is what a table of judgements is.
  materialized: true
  ttl: 6h
  # THREE SWEEPS, JOINED GRAPH-SIDE — not a walk out from each account.
  #
  # This opened `MATCH (a:CustomerAccount)-[:HAS_CASE]->(c:SupportCase)`, which binds every
  # account as an anchor and asks the desk about each one. At 1,904 accounts it refused outright
  # (`exceeding maxAnchors 200`), so the Account Signals app withheld the awareness signal
  # entirely and told the reader the judgement did not answer.
  #
  # Inverted it is the same shape the notes views use: chatter off the book's message door, the
  # CRM records off the partner door, and the open-case set off the DESK. Every aggregate sits
  # AFTER the last join, per the JOIN-BEFORE-AGGREGATING rule the conjunction views record — and
  # every collect dedupes on the record's OWN id, because joining three sweeps fans out and a
  # plain collect would repeat each note once per case.
  #
  # CAPPED at 150 accounts, worst back-and-forth first. The model is no longer the reason —
  # batched, 150 accounts is ~8 calls and 1.5s of model time — the three-sweep join is: ~21s cold
  # at 150 and ~43s at all 667 open-case accounts (measured 2026-09-22), most of it graph work.
  # Raise the cap when the join is cheaper, not the judge.
  #
  # SETTLE WHAT IS ALREADY KNOWN before the model is asked. An account sales never wrote about is
  # unaware by definition, and one whose case subject appears verbatim in a note is aware by the
  # same word test the Account Signals app applies — neither needs a model. The guard is the first
  # argument of the `coalesce` around `classify`; only accounts it leaves null reach the judge. On
  # the generated book it settles nothing (every account has notes, none quotes a subject), so it
  # costs nothing there and earns its keep on real CRM data.
  cypher: |
    MATCH (b:OdooBook {scope:'all'})-[:HAS_MESSAGE]->(n:OdooMessage)
    // The partner key is computed ONCE here, as a plain value, so the join below is an equality
    // of two values the planner can hash-join. Written `k.id = toString(n.res_id)`, the function
    // on one side made it a 6,000 × 4,010 cartesian filter: 13.6s against 2.5s, measured
    // 2026-09-22 with every sweep cached.
    WITH n, toString(n.res_id) AS partnerId
    MATCH (b2:OdooBook {scope:'all'})-[:HAS_PARTNER]->(k:OdooCustomer)
    WHERE k.id = partnerId
    WITH n, split(k.email, '@')[1] AS domain
    MATCH (d:ChatwootDesk {status:'open'})-[:HAS_CASE]->(c:ChatwootConversation)
    WHERE c.accountKey = domain
    WITH domain,
         collect(DISTINCT [c.id, c.subject]) AS caseRows,
         collect(DISTINCT [n.id, n.body]) AS noteRows,
         max(c.replyCount) AS longestThread
    ORDER BY longestThread DESC
    LIMIT 150
    WITH domain, caseRows, noteRows, size(caseRows) AS openCases, size(noteRows) AS noteCount,
         reduce(t = '', x IN caseRows | t + ' | ' + x[1]) AS problems,
         reduce(t = '', x IN noteRows | t + ' | ' + coalesce(x[1], '')) AS written
    MATCH (a:CustomerAccount {accountKey: domain})
    RETURN a.accountKey AS accountKey, a.name AS account, openCases, noteCount,
           [x IN caseRows | x[1]] AS subjects,
           coalesce(CASE WHEN written = '' THEN 'unaware'
                         WHEN any(x IN caseRows WHERE toLower(written) CONTAINS toLower(x[1])) THEN 'aware' END,
           classify('OPEN SUPPORT PROBLEMS: ' + problems + '  ||  WHAT SALES HAS WRITTEN IN THE CRM: ' + CASE WHEN written = '' THEN '(nothing)' ELSE written END,
             'aware,unaware',
             'Each item lists what a customer has open with SUPPORT, then everything SALES has written about that customer in the CRM (HTML tags are noise). Decide whether sales knows about the topic. aware: any CRM note touches the SAME TOPIC as any support item, in any words - for example a support item about data residency and a note saying the customer is concerned about GDPR or data residency, or a support item asking for a report builder and a note about custom reporting needs. unaware: no note touches any of the support topics; the notes are only about deals, renewals, stakeholders or the company in general.')) AS crmAwareness
    ORDER BY account
