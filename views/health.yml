# Two kinds of view, and the split is deliberate.
#
# FACTS PER ACCOUNT (the first group): one fact about every account that has it, keyed by
# `accountKey`. Each reads ONE system and joins it to the CustomerAccount spine. A surface
# composes them by accountKey — that is how the Account Signals app builds every signal it
# shows, including the ones that need an ABSENCE ("no open case", "nothing written since"),
# which one query cannot yet say reliably: a multi-hop OPTIONAL MATCH in a later stage reads as
# null, silently (embabel/me#1348). A fact view either has a row for an account or does not, and
# that is an absence nobody has to trust an engine about.
#
# CONJUNCTIONS (the second group): the Bad things that ARE one honest query, for a caller who is
# not the app — a question asked in words, an agent over MCP. Each is "accounts with this AND
# that", written as plain MATCH stages, every one run against the live systems.
#
# NO VIEW NAMES A PRODUCT — not in its name, its labels, its relationships or its properties.
# Everything here is the business vocabulary's (realm-business-vocabulary): SupportCase,
# BillingInvoice, Opportunity and the rest; TRACKED_AS, BILLED_AS, HAS_CASE; `status`, `amount`,
# `closeOn`. Which CRM, helpdesk and billing system answer is the world's business, and these views
# run unchanged over any that sign the vocabulary's contract.
#
# THE SHAPE EVERY VIEW HAS, and why. A question about the whole book starts with a SWEEP by the bare
# vocabulary label — `MATCH (c:SupportCase)` — which the installed product answers through its book
# door in a call or a page walk. Only then does it join to accounts:
#
#   - a SupportCase carries `accountKey` itself (the contract asks it to), so the account is a value
#     match on the spine and costs nothing;
#   - a CRM or billing record does not, so the join is the spine's own edge, TRACKED_AS or
#     BILLED_AS. Those ask the product about one account at a time, which is refused above a few
#     hundred accounts; after the sweep they are answered from the swept records instead (the edge's
#     `ridesHub`, see the vocabulary README, "Reading a whole system").
#
# Written the other way round — `(a:CustomerAccount)-[:HAS_CASE]->(c)` first — the answers are the
# same on a small book and refused on a real one.
#
# Every view name carries the prefix because view names resolve globally across realms. Money is in
# major units of `currency`; NEVER add across currencies.

# ── Who the accounts are ──────────────────────────────────────────────────────────────────

# A company becomes a CustomerAccount when one of the systems' realms keys it, and that happens as
# the system's records are READ. Nothing reads them ahead of a question yet (embabel/me#1368), so a
# surface that wants every account first asks this, which reads each system's whole population by
# its bare vocabulary label. It names no product — the surface it replaces walked one view per
# product, by name — and the engine counts a read like this as the spine being built, so the
# questions after it stop warning SPINE_NOT_BUILT.
#
# `collect`, never `count`: a source that can count at the source would answer `count` without
# reading a record, and a record not read keys no account.
- name: HealthKnownAccounts
  description: >-
    Reads the CRM's companies, the billing system's customers and the helpdesk's cases in full,
    so that every company any of them knows is a customer account, and says how many each holds.
    Run it before asking about accounts across the book. THE answer for "how many accounts do we
    have" and "how many companies does each system know".
  outputLabel: KnownAccountsRow
  cypher: |
    MATCH (k:CrmAccount)
    WITH size(collect(k.name)) AS crmCompanies
    MATCH (b:BillingCustomer)
    WITH crmCompanies, size(collect(b.name)) AS billingCustomers
    MATCH (c:SupportCase)
    WITH crmCompanies, billingCustomers, size(collect(c.subject)) AS supportCases
    MATCH (a:CustomerAccount)
    RETURN crmCompanies, billingCustomers, supportCases, count(a) AS accounts

# ── Facts per account ─────────────────────────────────────────────────────────────────────

# HOW MANY, and WHICH, are two questions with different costs — so they are two views. Triage
# ("which accounts are in trouble") asks the counting question across every account; the detail pane
# asks the collecting one about the handful it is showing.
- name: HealthOpenCaseCountsByAccount
  description: >-
    Per account: HOW MANY support cases a customer is still waiting on — the count, the longest
    back-and-forth, and when the oldest was opened. THE answer for "which customers have open
    support cases" and "who is waiting on us" across the whole book. An account absent from this
    list has nothing open. For WHAT the cases are about, ask HealthOpenCasesByAccount about the
    accounts this names.
  outputLabel: AccountOpenCaseCountsRow
  # The `WITH` that projects `c.accountKey` is load-bearing: it blocks AGGREGATE PUSHDOWN. A helpdesk
  # that can count at the source would otherwise answer `count(c)` with stand-in nodes carrying no
  # properties, and the account match would read null off every one.
  #
  # Only accounts the spine knows are reported, deliberately: a case whose accountKey matches no
  # account is a desk record for a company nobody sells to or bills.
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'open'
    WITH c, c.accountKey AS domain
    MATCH (a:CustomerAccount {accountKey: domain})
    RETURN a.accountKey AS accountKey, a.name AS account, count(c) AS openCases,
           max(c.replyCount) AS longestThread, min(c.openedOn) AS firstOpened
    ORDER BY openCases DESC, longestThread DESC

- name: HealthUrgentCaseCountsByAccount
  description: >-
    Per account: how many of the open support cases are URGENT or HIGH priority. The escalation
    signal behind HealthOpenCaseCountsByAccount — an account absent from this list has open cases
    but none of them urgent.
  outputLabel: AccountUrgentCaseCountsRow
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'open' AND c.priority IN ['urgent', 'high']
    WITH c, c.accountKey AS domain
    MATCH (a:CustomerAccount {accountKey: domain})
    RETURN a.accountKey AS accountKey, a.name AS account, count(c) AS urgentCases
    ORDER BY urgentCases DESC

- name: HealthOpenCasesByAccount
  description: >-
    Per account: WHAT the open support cases are about — their subjects, ids and links, alongside
    the same counts. The detail behind HealthOpenCaseCountsByAccount, for every account with an
    open case; it takes no parameters. To ask about one account, filter its rows by accountKey.
  outputLabel: AccountOpenCasesRow
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'open'
    WITH c, c.accountKey AS domain
    MATCH (a:CustomerAccount {accountKey: domain})
    RETURN a.accountKey AS accountKey, a.name AS account, count(c) AS openCases,
           sum(CASE WHEN c.priority IN ['urgent', 'high'] THEN 1 ELSE 0 END) AS highPriority,
           max(c.replyCount) AS longestThread, min(c.openedOn) AS firstOpened,
           collect(c.subject) AS subjects, collect(c.id) AS caseIds, collect(c.sourceUrl) AS caseUrls
    ORDER BY openCases DESC, longestThread DESC

- name: HealthResolvedCasesByAccount
  description: >-
    Per account: the support cases that have been RESOLVED — how many, when the latest was
    closed, and what they were about. THE answer for "what have we fixed for <customer>" and
    "who have we recently helped".
  outputLabel: AccountResolvedCasesRow
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'resolved'
    WITH c, c.accountKey AS domain
    MATCH (a:CustomerAccount {accountKey: domain})
    RETURN a.accountKey AS accountKey, a.name AS account, count(c) AS resolvedCases,
           max(c.closedOn) AS lastResolved, collect(c.subject) AS subjects
    ORDER BY lastResolved DESC

# Billing records carry no accountKey (the vocabulary leaves a billing system to reach the account by
# BILLED_AS), so these sweep the billing customers AND the records, then join. The invoice and
# subscription edges from a customer ride the record sweep for the same reason BILLED_AS rides the
# customer sweep: one page walk per kind, never one call per customer.
- name: HealthReceivablesByAccount
  description: >-
    Per account, MOST OWED FIRST: what is owed and not collected — the amount, unpaid invoices
    counted, how many FAILED collection, and links to the invoices. THE answer for "which
    accounts owe us the most", "which accounts owe us money", "who owes us the most money" and
    "who has a failed payment". "The most" means the largest AMOUNT, never the most invoices.
    An account absent from this list owes nothing.
  outputLabel: AccountReceivablesRow
  cypher: |
    MATCH (i:BillingInvoice)
    WHERE i.paymentStatus <> 'succeeded'
    MATCH (bc:BillingCustomer)
    MATCH (a:CustomerAccount)-[:BILLED_AS]->(bc)-[:HAS_INVOICE]->(i)
    RETURN a.accountKey AS accountKey, a.name AS account, i.currency AS currency,
           count(i) AS unpaidInvoices,
           sum(CASE WHEN i.paymentStatus = 'failed' THEN 1 ELSE 0 END) AS failedInvoices,
           sum(i.amount - i.amountPaid) AS owed,
           collect(i.number) AS invoices, collect(i.sourceUrl) AS invoiceUrls
    ORDER BY owed DESC

- name: HealthBillingByAccount
  description: >-
    Per account: every invoice billing has issued them, and how many were paid. THE answer for
    "is <customer> a good payer" and the way to tell a billed account from one billing has
    never heard of. An account absent from this list is not billed.
  outputLabel: AccountBillingRow
  cypher: |
    MATCH (i:BillingInvoice)
    MATCH (bc:BillingCustomer)
    MATCH (a:CustomerAccount)-[:BILLED_AS]->(bc)-[:HAS_INVOICE]->(i)
    RETURN a.accountKey AS accountKey, a.name AS account, i.currency AS currency,
           count(i) AS invoices,
           sum(CASE WHEN i.paymentStatus = 'succeeded' THEN 1 ELSE 0 END) AS paidInvoices
    ORDER BY invoices DESC

- name: HealthRecurringByAccount
  description: >-
    Per account: what they pay on a schedule — active subscriptions, the amount per billing
    period, what the products are, and when the next one renews. THE answer for "how much is
    <customer> worth to us", "who are our biggest customers" and "who renews soon". Amounts are
    per billing period as the plan defines it; do not annualize them.
  outputLabel: AccountRecurringRow
  cypher: |
    MATCH (s:BillingSubscription)
    WHERE s.status = 'active'
    MATCH (bc:BillingCustomer)
    MATCH (a:CustomerAccount)-[:BILLED_AS]->(bc)-[:HAS_SUBSCRIPTION]->(s)
    RETURN a.accountKey AS accountKey, a.name AS account, s.currency AS currency,
           count(s) AS activeSubscriptions, sum(s.amount) AS perPeriod,
           min(s.periodEndsOn) AS nextRenewal, collect(s.product) AS products
    ORDER BY perPeriod DESC

# CRM records carry no accountKey either; TRACKED_AS is the join. The CrmAccount sweep is every
# company the CRM knows, prospects included — the population TRACKED_AS reaches, which is what
# makes riding it sound (a sweep of paying customers only would lose every prospect without a word).
- name: HealthPipelineByAccount
  description: >-
    Per account: the deals sales has with them — open pipeline value, the open deals by name,
    when the next is due to close, and how many were won and lost. THE answer for "what are we
    trying to sell <customer>" and "how much pipeline do we have with <customer>". An account
    absent from this list has no deal in the CRM, open or closed.
  outputLabel: AccountPipelineRow
  cypher: |
    MATCH (o:Opportunity)
    MATCH (k:CrmAccount)
    MATCH (a:CustomerAccount)-[:TRACKED_AS]->(k)-[:HAS_OPPORTUNITY]->(o)
    RETURN a.accountKey AS accountKey, a.name AS account,
           sum(CASE WHEN o.status = 'open' THEN o.amount ELSE 0 END) AS openPipeline,
           sum(CASE WHEN o.status = 'open' THEN 1 ELSE 0 END) AS openDeals,
           sum(CASE WHEN o.status = 'won' THEN 1 ELSE 0 END) AS wonDeals,
           sum(CASE WHEN o.status = 'lost' THEN 1 ELSE 0 END) AS lostDeals,
           collect(CASE WHEN o.status = 'open' THEN o.title END) AS openDealNames,
           min(CASE WHEN o.status = 'open' THEN o.closeOn END) AS nextClose
    ORDER BY openPipeline DESC

- name: HealthCrmRecordByAccount
  description: >-
    Per account: the CRM's own record of it, and a link to open it there. THE way to tell an
    account sales knows from one it does not: an account absent from this list has no record in
    the CRM at all — customer or prospect — however much it is billed or however many cases it
    has open.
  outputLabel: AccountCrmRecordRow
  cypher: |
    MATCH (k:CrmAccount)
    MATCH (a:CustomerAccount)-[:TRACKED_AS]->(k)
    RETURN a.accountKey AS accountKey, a.name AS account, k.website AS website,
           k.sourceUrl AS crmUrl
    ORDER BY account

# The three notes views answer only for accounts with an open case, so they start from the cases.
# The note edges (HAS_NOTE, HAS_ACCOUNT_CONTACT, HAS_OPPORTUNITY) are asked of the CRM for those
# accounts' records, which a product realm may answer in batches; TRACKED_AS rides the company sweep.
- name: HealthCompanyNotesForOpenCases
  description: >-
    For every account with an open support case: the notes on the company's own CRM record,
    with their text and date. Part of "does the CRM know about this customer's problem".
  outputLabel: OpenCaseCompanyNoteRow
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'open'
    WITH DISTINCT c.accountKey AS domain
    MATCH (a:CustomerAccount {accountKey: domain})
    WITH a
    MATCH (k:CrmAccount)
    MATCH (a)-[:TRACKED_AS]->(k)-[:HAS_NOTE]->(n:AccountNote)
    RETURN a.accountKey AS accountKey, 'the company' AS writtenOn, k.name AS subject,
           n.writtenOn AS date, n.body AS body
    ORDER BY date DESC

- name: HealthDealNotesForOpenCases
  description: >-
    For every account with an open support case: the notes on its DEALS in the CRM, with their
    text, date and the deal they are on.
  outputLabel: OpenCaseDealNoteRow
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'open'
    WITH DISTINCT c.accountKey AS domain
    MATCH (a:CustomerAccount {accountKey: domain})
    WITH a
    MATCH (k:CrmAccount)
    MATCH (n:AccountNote)
    MATCH (a)-[:TRACKED_AS]->(k)-[:HAS_OPPORTUNITY]->(o:Opportunity)-[:HAS_NOTE]->(n)
    RETURN a.accountKey AS accountKey, 'a deal' AS writtenOn, o.title AS subject,
           n.writtenOn AS date, n.body AS body
    ORDER BY date DESC

- name: HealthContactNotesForOpenCases
  description: >-
    For every account with an open support case: the notes on the PEOPLE the CRM knows there,
    with their text, date and who they are about.
  outputLabel: OpenCaseContactNoteRow
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'open'
    WITH DISTINCT c.accountKey AS domain
    MATCH (a:CustomerAccount {accountKey: domain})
    WITH a
    MATCH (k:CrmAccount)
    MATCH (a)-[:TRACKED_AS]->(k)-[:HAS_ACCOUNT_CONTACT]->(p:AccountContact)-[:HAS_NOTE]->(n:AccountNote)
    RETURN a.accountKey AS accountKey, 'a contact' AS writtenOn, p.name AS subject,
           n.writtenOn AS date, n.body AS body
    ORDER BY date DESC

# ── Conjunctions ──────────────────────────────────────────────────────────────────────────
#
# Each side is aggregated per account BEFORE the other is joined, so neither multiplies the other:
# two open cases and three open deals are two cases and three deals, not six of each.

- name: HealthSellingIntoTrouble
  description: >-
    Accounts where sales has an OPEN DEAL and the customer has an OPEN SUPPORT CASE, largest
    deal first — with the longest thread and what it is about. THE answer for "are we about to
    pitch an unhappy customer", "which deals are at risk from support problems" and "what
    should sales know before the next call".
  outputLabel: SellingIntoTroubleRow
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'open'
    WITH c, c.accountKey AS domain
    MATCH (a:CustomerAccount {accountKey: domain})
    WITH a, count(c) AS openCases, max(c.replyCount) AS longestThread, collect(c.subject) AS subjects
    MATCH (o:Opportunity)
    WHERE o.status = 'open'
    MATCH (k:CrmAccount)
    MATCH (a)-[:TRACKED_AS]->(k)-[:HAS_OPPORTUNITY]->(o)
    WITH a, openCases, longestThread, subjects, sum(o.amount) AS openPipeline, collect(o.title) AS deals
    RETURN a.accountKey AS accountKey, a.name AS account, openCases, longestThread, subjects,
           openPipeline, deals
    ORDER BY openPipeline DESC

- name: HealthOwingAndWaiting
  description: >-
    Accounts with OPEN SUPPORT CASES AND UNPAID INVOICES at the same time, most owed first. THE
    answer for "which accounts have open support cases and unpaid invoices", "who owes us money
    and is waiting on support" and "who is not paying and also has a problem open" — the
    accounts where a collections call and a support fix are the same conversation.
  outputLabel: OwingAndWaitingRow
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'open'
    WITH c, c.accountKey AS domain
    MATCH (a:CustomerAccount {accountKey: domain})
    WITH a, count(c) AS openCases, collect(c.subject) AS subjects
    MATCH (i:BillingInvoice)
    WHERE i.paymentStatus <> 'succeeded'
    MATCH (bc:BillingCustomer)
    MATCH (a)-[:BILLED_AS]->(bc)-[:HAS_INVOICE]->(i)
    WITH a, openCases, subjects, count(i) AS unpaidInvoices, sum(i.amount - i.amountPaid) AS owed,
         collect(DISTINCT i.currency)[0] AS currency
    RETURN a.accountKey AS accountKey, a.name AS account, unpaidInvoices, owed, currency,
           openCases, subjects
    ORDER BY owed DESC

- name: HealthRevenueBehindCases
  description: >-
    Recurring revenue sitting behind open support cases: every paying account with something
    open, what it pays per billing period, and when it next renews. THE answer for "how much
    revenue is at risk from open support cases" and "which unhappy customers renew soonest".
  outputLabel: RevenueBehindCasesRow
  cypher: |
    MATCH (c:SupportCase)
    WHERE c.status = 'open'
    WITH c, c.accountKey AS domain
    MATCH (a:CustomerAccount {accountKey: domain})
    WITH a, count(c) AS openCases,
         sum(CASE WHEN c.priority IN ['urgent', 'high'] THEN 1 ELSE 0 END) AS highPriority,
         max(c.replyCount) AS longestThread
    MATCH (s:BillingSubscription)
    WHERE s.status = 'active'
    MATCH (bc:BillingCustomer)
    MATCH (a)-[:BILLED_AS]->(bc)-[:HAS_SUBSCRIPTION]->(s)
    WITH a, openCases, highPriority, longestThread, sum(s.amount) AS perPeriod,
         collect(DISTINCT s.currency)[0] AS currency, min(s.periodEndsOn) AS nextRenewal
    RETURN a.accountKey AS accountKey, a.name AS account, openCases, highPriority, longestThread,
           perPeriod, currency, nextRenewal
    ORDER BY perPeriod DESC

- name: HealthBilledButUnknownToCrm
  description: >-
    Customers we BILL that the CRM has NO RECORD of. THE answer for "who are we billing that
    the CRM has no record of", "who are we billing that sales has never heard of", "which paying
    customers are missing from the CRM" and "which customers have no account owner". These are
    business customers in the billing system — nothing to do with the user's own household bills.
  outputLabel: BilledButUnknownRow
  # Both sweeps first, so the absence is judged against the WHOLE CRM: with TRACKED_AS asked per
  # account the answer is the same here and refused on a real book.
  # `collect(k)` and not `count(k)`: a count the CRM can answer at the source would fetch no records,
  # and with none swept TRACKED_AS falls back to asking per account.
  cypher: |
    MATCH (k:CrmAccount)
    WITH collect(k) AS crm
    MATCH (bc:BillingCustomer)
    MATCH (a:CustomerAccount)-[:BILLED_AS]->(bc)
    OPTIONAL MATCH (a)-[:TRACKED_AS]->(t:CrmAccount)
    WITH a, bc, count(t) AS crmRecords
    WHERE crmRecords = 0
    RETURN a.accountKey AS accountKey, a.name AS account, bc.email AS billingEmail,
           bc.customerSince AS billedSince
    ORDER BY account
